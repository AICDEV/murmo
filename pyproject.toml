[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "murmo"
version = "0.1.0"
description = "Just talk: record from your microphone and transcribe locally with Whisper, straight to your clipboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jens Schmidt" }]
requires-python = ">=3.10"
dependencies = [
    "openai-whisper",
    "sounddevice",
    "scipy",
    "numpy",
]
keywords = ["whisper", "speech-to-text", "transcription", "dictation", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
murmo = "murmo:main"

[tool.setuptools]
py-modules = ["murmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
